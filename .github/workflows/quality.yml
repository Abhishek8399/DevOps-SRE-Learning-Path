name: Reader quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    working-directory: learning-cockpit

jobs:
  validate:
    name: Validate local reader and canonical content
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v6
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.8.0
          cache: npm
          cache-dependency-path: learning-cockpit/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate canonical content and generated registry
        run: npm run validate:content

      - name: Enforce canonical and staged reference review windows
        run: npm run report:references -- --fail-overdue

      - name: Run fail-closed content-schema tests
        run: npm run test:content-schema

      - name: Run reader behavior tests
        run: npm run test:reader

      - name: Run type and lint checks
        run: |
          npm run typecheck
          npm run lint

      - name: Build the production reader
        run: npm run build

      - name: Enforce generated asset budget
        run: npm run audit:web-budget

      - name: Check canonical local-lab source contracts
        run: npm run report:labs

      - name: Check tracked source hygiene
        run: npm run audit:hygiene

      - name: Refuse unexpected generated changes
        working-directory: .
        run: |
          git diff --check
          git diff --exit-code
