apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-budget
  namespace: team-a
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 2Gi
    pods: "10"
    services: "5"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-budget
  namespace: team-b
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 2Gi
    pods: "10"
    services: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
  namespace: team-a
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 256Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
  namespace: team-b
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 256Mi
