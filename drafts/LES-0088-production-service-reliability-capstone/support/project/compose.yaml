name: atlas-capstone

services:
  app:
    build:
      context: .
    image: atlas-capstone/service:0.1.0
    environment:
      ATLAS_VERSION: "0.1.0"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - atlas-state:/var/lib/atlas
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - backend
      - edge
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=1).read()"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  proxy:
    profiles: ["full"]
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    user: "101:101"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:18443:8443"
    volumes:
      - ./ops/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - edge
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    profiles: ["full"]
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-state:/prometheus
    networks:
      - backend
      - edge
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  backend:
    internal: true
  edge:

volumes:
  atlas-state:
  prometheus-state:
