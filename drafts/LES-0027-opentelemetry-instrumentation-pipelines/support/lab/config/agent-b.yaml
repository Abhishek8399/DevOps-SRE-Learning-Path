extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 24
  resource/agent_identity:
    attributes:
      - key: lab.collector.role
        action: upsert
        value: agent-b
  batch:
    timeout: 500ms
    send_batch_size: 1
    send_batch_max_size: 1

exporters:
  otlp/gateway:
    endpoint: gateway:4317
    tls:
      insecure: true
    timeout: 2s
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 256
    retry_on_failure:
      enabled: true
      initial_interval: 250ms
      max_interval: 1s
      max_elapsed_time: 10s

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/agent_identity, batch]
      exporters: [otlp/gateway]
