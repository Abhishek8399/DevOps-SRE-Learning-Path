extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 24
  resource/gateway_identity:
    attributes:
      - key: lab.collector.role
        action: upsert
        value: gateway
  batch:
    timeout: 500ms
    send_batch_size: 32
    send_batch_max_size: 64

exporters:
  debug:
    verbosity: detailed
    sampling_initial: 100
    sampling_thereafter: 1

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/gateway_identity, batch]
      exporters: [debug]
