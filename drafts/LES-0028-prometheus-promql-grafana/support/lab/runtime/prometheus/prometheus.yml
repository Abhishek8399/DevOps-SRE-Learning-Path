global:
  scrape_interval: 1s
  scrape_timeout: 800ms
  evaluation_interval: 1s
  external_labels:
    environment: les0028-local

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: training-fixture
    static_configs:
      - targets: [fixture:8080]
        labels:
          lesson: LES-0028
