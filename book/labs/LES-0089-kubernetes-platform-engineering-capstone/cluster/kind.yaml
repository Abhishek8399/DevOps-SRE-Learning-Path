kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: atlas-platform
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18080
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    labels:
      topology.kubernetes.io/zone: local-a
      platform.atlas.dev/pool: general
  - role: worker
    labels:
      topology.kubernetes.io/zone: local-b
      platform.atlas.dev/pool: general
